name = "foundry-ai"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Public values (the same ones shipped in the web bundle). Secrets are set with
# `wrangler secret put`: ANTHROPIC_API_KEY, BREVO_API_KEY.
SUPABASE_URL = "https://iwresyrdyalwkowyxxwr.supabase.co"
# Measured 2026-09-20 on a 4-day full-body build (all covered every group with 0 invented ids):
#   claude-opus-5   medium  80s  ~$0.25      claude-sonnet-5 medium  76s  ~$0.11
#   claude-opus-5   low     56s  ~$0.19      claude-sonnet-5 low     25s  ~$0.05   <- chosen
COACH_MODEL = "claude-sonnet-5"
COACH_EFFORT = "low"

# Per-user ceiling on coach builds — each one is a paid model call.
[[ratelimits]]
name = "COACH_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60
